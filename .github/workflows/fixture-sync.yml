name: Fixture presentation sync

on:
  workflow_dispatch:
  push:
    branches:
      - codex/effective-status
  schedule:
    - cron: "40 11 * * *"

permissions:
  contents: write

concurrency:
  group: canvases-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run fixtures:sync
      - run: npm run standings:build
      - run: npm run validate
      - run: npm test
      - run: git diff --check

      - name: Publish validated fixture projection
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No staged data changes to publish."
            exit 0
          fi
          git commit -m "chore(data): refresh fixture presentation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
