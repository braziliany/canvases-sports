name: Result data sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 11-16 * * 6"

permissions:
  contents: write

concurrency:
  group: result-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run results:sync
      - run: npm run standings:build
      - run: npm run validate
      - run: npm test
      - run: git diff --check

      - name: Publish validated data changes
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No data changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): sync confirmed match results"
          git push origin "HEAD:${GITHUB_REF_NAME}"
